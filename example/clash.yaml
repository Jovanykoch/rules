# ======================================================================
# Jovanykoch/rules — Example Clash Config (mihomo kernel)
# https://github.com/Jovanykoch/rules
#
# Consumes the daily-built rule tags published on the `rel` branch.
# Rule files are `behavior: domain` payloads (see README "Common Download URLs").
#
# Tags used here:
#   reject.yaml      Ad/tracker blocklist            -> REJECT
#   school.yaml      School & education domains      -> School group
#   loc-cn.yaml      Mainland China domains          -> DIRECT
#   apple.yaml       Apple services                  -> DIRECT
#   douyin.yaml      Douyin (China TikTok)           -> Proxy
#
# Other tags available on rel (add your own providers as needed):
#   ads.yaml, ads-mini.yaml, china.yaml, streaming-cn.yaml,
#   ai.yaml, microsoft.yaml, gfw.yaml, gfw-ipcidr.yaml, loc-!cn.yaml
#
# QUICK START
#   1. Replace "https://your-subscription-url" below with your own link
#      (or define proxies manually in the commented example).
#   2. Import into Clash Verge Rev / mihomo and enable.
# ======================================================================

mixed-port: 7890
allow-lan: true
ipv6: false
mode: rule
log-level: info
global-client-fingerprint: chrome
external-controller: 127.0.0.1:9090

geodata-mode: true
geox-url:
  geoip: https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat
  geosite: https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  listen: :1053
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - stun.*
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 1.1.1.1
    - 8.8.8.8

# ======================= ADD YOUR NODES HERE =======================
# Option A: use a subscription (recommended). Replace the URL below.
# Option B: define proxies manually (examples commented out).
# Never commit real credentials or subscription URLs to a public repo.
# ===================================================================
proxy-providers:
  subscription:
    type: http
    url: https://your-subscription-url
    interval: 3600
    path: ./proxy_providers/subscription.yaml
    health-check:
      enable: true
      interval: 600
      url: http://cp.cloudflare.com/generate_204
# proxies:
  # --- Shadowsocks example ---
  # - {name: HK-SS, type: ss, server: YOUR_SERVER, port: 8388,
  #    cipher: aes-256-gcm, password: YOUR_PASSWORD, udp: true}

proxy-groups:
  - name: Proxy
    type: select
    include-all: true
    proxies: [DIRECT]
  - name: Auto
    type: url-test
    include-all: true
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
  - {name: School, type: select, proxies: [Proxy, Auto, DIRECT]}
  - {name: ADBlock, type: select, proxies: [REJECT, DIRECT]}
  - {name: Final, type: select, proxies: [Proxy, Auto, DIRECT]}

# Rule tags: daily CI builds published on the `rel` branch.
rule-providers:
  Reject:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Jovanykoch/rules/rel/reject.yaml
    path: ./ruleset/Reject.yaml
    interval: 86400
  School:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Jovanykoch/rules/rel/school.yaml
    path: ./ruleset/School.yaml
    interval: 86400
  LocCN:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Jovanykoch/rules/rel/loc-cn.yaml
    path: ./ruleset/LocCN.yaml
    interval: 86400
  Apple:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Jovanykoch/rules/rel/apple.yaml
    path: ./ruleset/Apple.yaml
    interval: 86400
  Douyin:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Jovanykoch/rules/rel/douyin.yaml
    path: ./ruleset/Douyin.yaml
    interval: 86400

rules:
  # Local networks first — never proxied.
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  # Block ads and trackers.
  - RULE-SET,Reject,ADBlock
  # School & education services.
  - RULE-SET,School,School
  - RULE-SET,Apple,DIRECT
  - RULE-SET,Douyin,Proxy
  # Mainland China — direct.
  - RULE-SET,LocCN,DIRECT
  - GEOIP,CN,DIRECT
  # Fallthrough.
  - MATCH,Final
